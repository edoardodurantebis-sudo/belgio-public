name: Belgium Public NRT Vintage Capture
on:
  workflow_dispatch:
  schedule:
    - cron: '3,18,33,48 * * * *'

permissions:
  actions: read
  contents: read

concurrency:
  # All state-writing workflows share one lock so that the latest artifact is
  # a serial history, never two competing snapshots.
  group: belgium-public-data-v2
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install -e .
      - name: Restore cumulative data state
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/restore_latest_state.sh
      - name: Capture public near-real-time vintages
        run: python scripts/run_factory.py --mode nrt
      - name: Re-evaluate lab gate without promoting unproven edges
        if: always()
        run: python scripts/run_lab.py
      - name: Upload cumulative public-data state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: belgium-public-state
          path: |
            data/raw
            data/canonical
            state
            research
          retention-days: 30
          if-no-files-found: warn
