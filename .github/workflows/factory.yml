name: Belgium Public Historical Factory
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'config/**'
      - 'pyproject.toml'
      - '.github/workflows/factory.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: bootstrap | incremental | all
        required: true
        default: incremental
  schedule:
    - cron: '27 03 * * *'

permissions:
  actions: read
  contents: read

concurrency:
  # v2 deliberately detaches the hardened pipeline from the obsolete first
  # bootstrap, whose concurrency contract cannot be changed retroactively.
  group: belgium-public-data-v2
  cancel-in-progress: true

jobs:
  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install -e .
      - name: Restore cumulative data state
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/restore_latest_state.sh
      - name: Run historical collector + canonical + health
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODE="${{ github.event.inputs.mode }}"
          elif [[ "${BELGIUM_STATE_RESTORED:-0}" == "1" ]]; then
            MODE="incremental"
          else
            MODE="bootstrap"
          fi
          echo "Factory mode: ${MODE}"
          python scripts/run_factory.py --mode "${MODE}" --strict-core
      - name: Audit JAO Core CNEC/RAM/PTDF endpoint without guessing
        if: always()
        run: python scripts/run_jao_audit.py
      - name: Build reproducible ex-post case registry
        if: always()
        run: python scripts/run_case_studies.py
      - name: Run market-lab scientific gate
        if: always()
        run: python scripts/run_lab.py
      - name: Build public DA profit workspace
        if: always()
        run: python scripts/build_profit_workspace.py
      - name: Run profit-first economic discovery gate
        if: always()
        run: python scripts/run_profit_lab.py
      - name: Upload cumulative public-data state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: belgium-public-state
          path: |
            data/raw
            data/canonical
            state
            research
          retention-days: 30
          if-no-files-found: warn
